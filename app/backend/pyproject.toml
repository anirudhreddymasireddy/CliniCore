[project]
name = "carepriority-ui-backend"
version = "0.1.0"
description = "CarePriority AI nurse UI backend: read-only Exasol access (MCP_READONLY) or local snapshot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyexasol>=0.26",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.uv]
package = false
